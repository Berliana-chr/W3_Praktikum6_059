<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>SIAKAD - halaman Login</title>

    <!-- Custom fonts for this template-->
    <link
      href="vendor/fontawesome-free/css/all.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet" />
  </head>

  <body class="bg-gradient-primary">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-7 col-md-9">
          <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
              <div class="p-5">
                <div class="text-center">
                  <h1 class="h3 text-gray-900 font-weight-bold mb-2">
                    Selamat Datang
                  </h1>
                  <p class="text-gray-600 mb-4">
                    Silakan masuk menggunakan akun Anda
                  </p>
                </div>

                <form>
                  <div class="form-group">
                    <label class="font-weight-bold text-gray-800" for="username"
                      >NIP / NIM / Username</label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text bg-light text-primary">
                          <i class="fas fa-user"></i>
                        </span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        id="username"
                        value="admin_dosen"
                      />
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="font-weight-bold text-gray-800" for="password"
                      >Kata Sandi</label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text bg-light text-primary">
                          <i class="fas fa-lock"></i>
                        </span>
                      </div>
                      <input
                        type="password"
                        class="form-control"
                        id="password"
                        value="password123"
                      />
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="font-weight-bold text-gray-800" for="role"
                      >Peran Sistem (Role)</label
                    >
                    <select
                      class="form-control"
                      id="role"
                      style="height: calc(1.5em + 0.75rem + 14px)"
                    >
                      <option>Dosen / Pengajar</option>
                      <option>Mahasiswa</option>
                      <option>Admin Akademik</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                      <input
                        type="checkbox"
                        class="custom-control-input"
                        id="customCheck"
                        checked
                      />
                      <label class="custom-control-label" for="customCheck"
                        >Ingat Saya di Perangkat Ini</label
                      >
                    </div>
                  </div>

                  <a
                    href="index.html"
                    class="btn btn-primary btn-user btn-block font-weight-bold shadow-sm"
                  >
                    <i class="fas fa-sign-in-alt mr-2"></i> Masuk ke Sistem
                  </a>
                </form>

                <hr />

                <div
                  class="bg-light rounded p-3 text-center small text-gray-600"
                >
                  <i class="fas fa-info-circle text-info mr-1"></i> Demo
                  Login:<br />
                  <span class="font-weight-bold">Username:</span>
                  <code>admin_dosen</code> |
                  <span class="font-weight-bold">Password:</span>
                  <code>password123</code>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>
  </body>
</html>
